<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="driaclip-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="driaclip-accent" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield / Icon Frame -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#09090b" stroke="url(#driaclip-grad)" stroke-width="2.5" />
  
  <!-- Film Sprocket Dots (Top & Bottom) -->
  <circle cx="14" cy="11" r="1.75" fill="#475569" />
  <circle cx="23" cy="11" r="1.75" fill="#475569" />
  <circle cx="32" cy="11" r="1.75" fill="#475569" />
  <circle cx="41" cy="11" r="1.75" fill="#475569" />
  <circle cx="50" cy="11" r="1.75" fill="#475569" />

  <circle cx="14" cy="53" r="1.75" fill="#475569" />
  <circle cx="23" cy="53" r="1.75" fill="#475569" />
  <circle cx="32" cy="53" r="1.75" fill="#475569" />
  <circle cx="41" cy="53" r="1.75" fill="#475569" />
  <circle cx="50" cy="53" r="1.75" fill="#475569" />

  <!-- Stylized Cut Angle & Play Trimmer Shape -->
  <path d="M22 18L38 32L22 46V18Z" fill="url(#driaclip-grad)" />
  <path d="M34 20L46 32L34 44" stroke="url(#driaclip-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Scissor Cut Notch Line -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
</svg>
